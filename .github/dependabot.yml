version: 2

# Este repo tenia 78 alertas abiertas y CERO PRs de Dependabot: el job no corria. Dos
# defectos de esta configuracion lo abortaban, y los dos se arreglan abajo.
#
# 1. Habia una entrada `github-actions` y el repo no tiene .github/workflows (en .github
#    solo esta este archivo). Una entrada para un ecosistema ausente aborta el job entero.
#
# 2. Habia un registro `github-npm` con `token: ${{ secrets.GITHUB_TOKEN }}`. Dependabot no
#    resuelve esa expresion: necesita un *secreto de Dependabot*. Era config muerta, ademas:
#    el package.json no declara ningun `@rizoma/*` y no hay .npmrc. Se retira el registro y
#    la referencia que lo usaba, porque dejar la referencia sin el bloque invalida el archivo.
#
# Se conserva todo lo demas a proposito: el horario diario con zona de Panama, los grupos, el
# prefijo de commit, las etiquetas y el limite. El grupo `rizoma-ui` apunta a `@rizoma/*`, que
# hoy no es dependencia de este repo; se deja como estaba, solo se señala.
updates:
  # Dependencias npm
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: "America/Panama"
    groups:
      # Las de seguridad llegan en un solo PR por tanda, no una por vulnerabilidad.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # Actualizar @rizoma/ui automáticamente
      rizoma-ui:
        patterns:
          - "@rizoma/*"
        update-types:
          - minor
          - patch
      # Agrupar otras dependencias de desarrollo
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "@rizoma/*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    # 0 apaga las de *version* y deja pasar las de seguridad, que no estan sujetas a este
    # limite. Es deliberado: este repo no tiene .github/workflows, asi que un bump de version
    # no tendria quien lo verifique. Al poner 5, Dependabot abrio cinco PRs de version en
    # minutos, uno de ellos un mayor de mermaid. Se enciende cuando el repo tenga su CI.
    open-pull-requests-limit: 0
